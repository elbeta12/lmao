<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichajes Haxball - Liga Profesional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            animation: fadeIn 0.8s ease;
        }

        .filters label {
            margin-right: 10px;
            font-weight: bold;
            color: #333;
        }

        .filters select {
            padding: 8px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            background: white;
            transition: all 0.3s ease;
        }

        .filters select:hover {
            border-color: #764ba2;
        }

        #fichajes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .fichaje {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        .fichaje::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .fichaje:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .fichaje-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .fichaje-tipo {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tipo-fichaje {
            background: #2ecc71;
            color: white;
        }

        .tipo-baja {
            background: #e74c3c;
            color: white;
        }

        .tipo-pendiente {
            background: #f39c12;
            color: white;
        }

        .fichaje-content {
            margin: 15px 0;
        }

        .fichaje-row {
            display: flex;
            margin: 10px 0;
            align-items: center;
        }

        .fichaje-label {
            font-weight: bold;
            color: #667eea;
            min-width: 100px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fichaje-value {
            color: #333;
            flex: 1;
        }

        .fichaje-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
            font-size: 0.85em;
            color: #999;
            text-align: right;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
        }

        .empty {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #999;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            #fichajes {
                grid-template-columns: 1fr;
            }

            .stat-card h3 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Fichajes Liga Haxball</h1>
            <p>Historial de Transferencias y Movimientos</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalFichajes">0</h3>
                <p>Total Movimientos</p>
            </div>
            <div class="stat-card">
                <h3 id="totalAltas">0</h3>
                <p>Fichajes</p>
            </div>
            <div class="stat-card">
                <h3 id="totalBajas">0</h3>
                <p>Bajas</p>
            </div>
        </div>

        <div class="filters">
            <label for="filtroTipo">Filtrar por tipo:</label>
            <select id="filtroTipo">
                <option value="todos">Todos</option>
                <option value="fichaje">Solo Fichajes</option>
                <option value="baja">Solo Bajas</option>
            </select>
        </div>

        <div id="fichajes">
            <div class="loading">⏳ Cargando fichajes...</div>
        </div>
    </div>

    <script>
        let fichajesData = [];

        async function cargarFichajes() {
            try {
                const res = await fetch('/api/fichajes');
                
                if (!res.ok) {
                    throw new Error('Error al cargar los datos');
                }

                fichajesData = await res.json();
                actualizarEstadisticas();
                renderizarFichajes();

            } catch (err) {
                console.error('Error cargando fichajes:', err);
                const container = document.getElementById('fichajes');
                container.innerHTML = `
                    <div class="error">
                        ❌ Error al cargar los fichajes. Por favor, intenta de nuevo más tarde.
                    </div>
                `;
            }
        }

        function actualizarEstadisticas() {
            const totalFichajes = fichajesData.length;
            const totalAltas = fichajesData.filter(f => f.tipo !== 'baja').length;
            const totalBajas = fichajesData.filter(f => f.tipo === 'baja').length;

            document.getElementById('totalFichajes').textContent = totalFichajes;
            document.getElementById('totalAltas').textContent = totalAltas;
            document.getElementById('totalBajas').textContent = totalBajas;
        }

        function renderizarFichajes() {
            const container = document.getElementById('fichajes');
            const filtro = document.getElementById('filtroTipo').value;

            let fichajesFiltrados = fichajesData;
            if (filtro !== 'todos') {
                fichajesFiltrados = fichajesData.filter(f => f.tipo === filtro);
            }

            if (fichajesFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        📭 No hay fichajes registrados
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            fichajesFiltrados.forEach((f, index) => {
                const div = document.createElement('div');
                div.className = 'fichaje';
                div.style.animationDelay = `${index * 0.1}s`;

                const tipoClass = f.tipo === 'baja' ? 'tipo-baja' : 'tipo-fichaje';
                const tipoEmoji = f.tipo === 'baja' ? '📉' : '✅';
                const tipoTexto = f.tipo === 'baja' ? 'Baja' : 'Fichaje';

                const fecha = new Date(f.fecha);
                const fechaFormateada = fecha.toLocaleDateString('es-ES', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                div.innerHTML = `
                    <div class="fichaje-header">
                        <span class="fichaje-tipo ${tipoClass}">${tipoEmoji} ${tipoTexto}</span>
                    </div>
                    
                    <div class="fichaje-content">
                        <div class="fichaje-row">
                            <span class="fichaje-label">👤 Jugador:</span>
                            <span class="fichaje-value">${f.jugadornombre || f.jugadorNombre || 'N/A'}</span>
                        </div>
                        
                        <div class="fichaje-row">
                            <span class="fichaje-label">🏆 Equipo:</span>
                            <span class="fichaje-value">${f.teamnombre || f.teamNombre || 'N/A'}</span>
                        </div>
                        
                        ${f.posicion ? `
                        <div class="fichaje-row">
                            <span class="fichaje-label">⚽ Posición:</span>
                            <span class="fichaje-value">${f.posicion}</span>
                        </div>
                        ` : ''}
                        
                        ${f.dorsal ? `
                        <div class="fichaje-row">
                            <span class="fichaje-label">🔢 Dorsal:</span>
                            <span class="fichaje-value">#${f.dorsal}</span>
                        </div>
                        ` : ''}
                        
                        ${f.motivo ? `
                        <div class="fichaje-row">
                            <span class="fichaje-label">📝 Motivo:</span>
                            <span class="fichaje-value">${f.motivo}</span>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="fichaje-footer">
                        🕒 ${fechaFormateada}
                    </div>
                `;
                
                container.appendChild(div);
            });
        }

        // Event listener para el filtro
        document.getElementById('filtroTipo').addEventListener('change', renderizarFichajes);

        // Cargar fichajes al iniciar
        cargarFichajes();

        // Recargar fichajes cada 10 segundos
        setInterval(cargarFichajes, 10000);
    </script>
</body>
</html>
